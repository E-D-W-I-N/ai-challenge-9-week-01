<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Challenge — стенд сценариев</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>AI Challenge — стенд сценариев</h1>
      <div id="key-status" class="badge"></div>
    </header>

    <main class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <h2>Сценарии</h2>
          <button id="sidebar-toggle" class="sidebar-toggle" type="button"
                  aria-controls="scenario-list" aria-expanded="true"></button>
        </div>
        <div id="scenario-list" class="scenario-list"></div>
        <div id="registry-errors" class="errors"></div>
      </aside>

      <section class="content">
        <!-- Кадр прогона: всё, что должно оставаться в экране целиком. -->
        <div class="stage">
          <div id="scenario-bar" class="scenario-bar">
            <p class="hint">Выберите сценарий слева.</p>
          </div>

          <div id="columns" class="columns"></div>
        </div>

        <!-- Вердикт и сводка уезжают под кадр: к ним прокручиваются. -->
        <div id="verdict" class="verdict hidden"></div>

        <div id="summary" class="summary hidden"></div>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
